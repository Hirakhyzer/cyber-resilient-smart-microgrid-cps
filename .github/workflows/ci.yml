name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Run preserved v0.1 deterministic benchmark suite
        if: matrix.python-version == '3.12'
        run: python scripts/run_benchmark.py
      - name: Run compact v0.2 multi-seed experiment suite
        if: matrix.python-version == '3.12'
        run: python scripts/run_v02_experiments.py --ci
      - name: Compare preserved v0.1 and v0.2
        if: matrix.python-version == '3.12'
        run: python scripts/run_v02_comparison.py --steps 240
